name: Build fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/dockerfile/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mehdilipari-ui/portabase:latest
            ghcr.io/mehdilipari-ui/portabase:${{ github.sha }}
          cache-from: type=gha,scope=fork-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=fork-${{ github.ref_name }}
